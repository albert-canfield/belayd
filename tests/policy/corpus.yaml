# The policy test table.
#
# Every row is something an agent might try, with the verdict we expect per preset.
# Rows run with cwd = workspace = /work/app and home = /home/dev.
#
# `balanced` is required. Unless a row says otherwise:
#   strict = balanced, except pass becomes ask (strict asks by default)
#   yolo   = balanced, except pass becomes allow (yolo-with-undo allows by default)
#
# Use `read:`, `write:` or `fetch:` instead of `cmd:` for non-shell actions.
# Every bug report should end up as a row here.

# --- Deleting home, root and system folders ---------------------------------
- { cmd: 'rm -rf ~', balanced: deny }
- { cmd: 'rm -rf ~/', balanced: deny }
- { cmd: 'rm -rf $HOME', balanced: deny }
- { cmd: 'rm -rf "$HOME"', balanced: deny }
