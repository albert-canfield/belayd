- { cmd: 'rm -r -f /etc', balanced: deny }
- { cmd: 'rm --recursive --force /var', balanced: deny }
- { cmd: 'rm -rf /{etc,usr}', balanced: deny }
- { cmd: 'rm -rf /{tmp,etc}', balanced: deny }
- { cmd: 'rm -rf ~/Documents', balanced: deny }
- { cmd: 'rm -rf ~/.ssh', balanced: deny }
- { cmd: 'rmdir ~/Desktop', balanced: deny }
- { cmd: 'find / -delete', balanced: deny }
