name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
      - name: Hook latency (fails above 100 ms overhead per call)
        run: node scripts/bench-hook.mjs --runs 30 --max-overhead 100
      - name: Packed tarball works with npx
        run: |
          tgz=$(npm pack --silent --pack-destination "$RUNNER_TEMP")
          cd "$RUNNER_TEMP"
          npx --yes --package "$RUNNER_TEMP/$tgz" belayd check 'rm -rf ~' | tee out.txt
          grep -q deny out.txt

  differential:
    # Runs about 650 commands for real in a throwaway container and checks that
    # belayd blocked or asked about everything dangerous they did.
    name: Differential test against real bash
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm differential
